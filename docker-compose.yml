# Start:  docker compose up -d --build     ->  http://localhost:8000
# Logs:   docker compose logs -f
# Stop:   docker compose down               (conversations and messages are kept in volumes)
services:
  app:
    build: .
    image: arabic-historical-characters:2.0
    container_name: historical-characters
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env          # GEMINI_API_KEY etc. (optional: without it answers come from Wikipedia)
        required: false
    environment:
      HOST: 0.0.0.0
    volumes:
      - conversations:/app/data/conversations
    restart: unless-stopped

volumes:
  conversations:
